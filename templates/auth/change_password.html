{% extends "base.html" %}
{% block title %}Change password{% endblock %}
{% block content %}
<div class="card" style="max-width:560px">
  <div class="card-head"><h3>Change password</h3></div>
  <div class="card-body">
    {% if error %}<div class="alert alert-error" role="alert">{{ error }}</div>{% endif %}
    <form method="post" action="{% url 'accounts:change_password' %}">
      {% csrf_token %}
      <div class="form-group">
        <label class="form-label" for="current">Current password<span class="req"> *</span></label>
        <input class="form-input" type="password" id="current" name="current_password" required autocomplete="current-password">
      </div>
      <div class="form-group">
        <label class="form-label" for="new1">New password<span class="req"> *</span></label>
        <input class="form-input" type="password" id="new1" name="new_password1" required autocomplete="new-password">
        <div class="form-hint">At least 10 characters, must not be a common or numeric-only password.</div>
      </div>
      <div class="form-group">
        <label class="form-label" for="new2">Confirm new password<span class="req"> *</span></label>
        <input class="form-input" type="password" id="new2" name="new_password2" required autocomplete="new-password">
      </div>
      <div class="form-actions">
        <button type="submit" class="btn btn-primary">Update password</button>
        <a class="btn btn-secondary" href="{% url 'accounts:profile' %}">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
