{% extends "errors/base_error.html" %}
{% block content %}
<div class="empty-state" style="padding:24px 8px">
  <h1 style="font-size:3rem;letter-spacing:-.04em">503</h1>
  <h3>{{ title|default:"Service unavailable" }}</h3>
  <p>{{ message|default:"GHDI MIS is briefly unavailable. Please try again soon." }}</p>
  <a class="btn btn-primary" href="{% url 'accounts:login' %}">Back to sign in</a>
</div>
{% endblock %}
