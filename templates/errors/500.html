{% extends "errors/base_error.html" %}
{% block content %}
<div class="empty-state" style="padding:24px 8px">
  <h1 style="font-size:3rem;letter-spacing:-.04em">500</h1>
  <h3>{{ title|default:"Server error" }}</h3>
  <p>{{ message|default:"Something went wrong on our side. Our team has been notified." }}</p>
  <a class="btn btn-primary" href="{% url 'accounts:login' %}">Back to sign in</a>
</div>
{% endblock %}
