{% extends "ghdi/generic_list.html" %}
{% block list_filters %}<form method="get" class="card card-body mb-4 d-flex flex-wrap gap-3 align-items-end"><div class="form-group"><label class="form-label" for="event-status">Status</label><select class="form-input form-select" id="event-status" name="status"><option value="">All statuses</option>{% for value,label in statuses %}<option value="{{ value }}" {% if request.GET.status == value %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></div><div class="form-group"><label class="form-label" for="event-start">From</label><input class="form-input" id="event-start" type="date" name="start_date" value="{{ request.GET.start_date }}"></div><div class="form-group"><label class="form-label" for="event-end">To</label><input class="form-input" id="event-end" type="date" name="end_date" value="{{ request.GET.end_date }}"></div><input type="hidden" name="q" value="{{ query }}"><button class="btn btn-primary" type="submit">Filter events</button><a class="btn btn-ghost" href="{% url 'cms:event_list' %}">Clear</a></form>{% endblock %}
