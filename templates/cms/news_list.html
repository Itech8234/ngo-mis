{% extends "ghdi/generic_list.html" %}
{% block list_filters %}<form method="get" class="card card-body mb-4 d-flex flex-wrap gap-3 align-items-end"><div class="form-group"><label class="form-label" for="news-category">Category</label><select class="form-input form-select" id="news-category" name="category"><option value="">All categories</option>{% for value,label in categories %}<option value="{{ value }}" {% if request.GET.category == value %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></div><div class="form-group"><label class="form-label" for="news-status">Status</label><select class="form-input form-select" id="news-status" name="status"><option value="">All statuses</option>{% for value,label in statuses %}<option value="{{ value }}" {% if request.GET.status == value %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></div><input type="hidden" name="q" value="{{ query }}"><button class="btn btn-primary" type="submit">Filter articles</button><a class="btn btn-ghost" href="{% url 'cms:news_list' %}">Clear</a></form>{% endblock %}
