{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Check your email — {{ ghdi_org_name }}</title>
<meta name="theme-color" content="#0f766e">
<link rel="icon" href="{% static 'img/favicon.svg' %}" type="image/svg+xml">
<link rel="stylesheet" href="{% static 'css/ghdi.css' %}">
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-brand">
      <span class="logo-mark" aria-hidden="true">{{ ghdi_acronym }}</span>
      <div><div class="font-bold" style="font-size:16px">{{ ghdi_org_name }}</div><div class="text-xs text-muted">Password reset</div></div>
    </div>
    <h1 style="font-size:1.3rem">Check your email</h1>
    <p class="text-secondary text-sm">If an account exists for that address, a password reset link has been sent. Check your inbox (and spam folder).</p>
    <div class="mt-4"><a class="btn btn-secondary btn-block" href="{% url 'accounts:login' %}">Back to sign in</a></div>
  </div>
</div>
</body>
</html>
