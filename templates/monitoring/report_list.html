{% extends "ghdi/generic_list.html" %}
{% block list_filters %}
<form method="get" class="card-body d-flex flex-wrap align-items-end gap-3 mb-3" aria-label="Filter MEAL reports">
  <div class="form-group mb-0"><label class="form-label" for="report-status">Status</label><select class="form-input" id="report-status" name="status"><option value="">All statuses</option>{% for value,label in statuses %}<option value="{{ value }}" {% if request.GET.status == value %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></div>
  <div class="form-group mb-0"><label class="form-label" for="report-type">Type</label><select class="form-input" id="report-type" name="report_type"><option value="">All types</option>{% for value,label in report_types %}<option value="{{ value }}" {% if request.GET.report_type == value %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></div>
  {% if query %}<input type="hidden" name="q" value="{{ query }}">{% endif %}<button class="btn btn-secondary" type="submit">Apply filters</button>
  {% if request.GET.status or request.GET.report_type or query %}<a class="btn btn-ghost" href="{% url 'monitoring:report_list' %}">Clear</a>{% endif %}
</form>
{% endblock %}
