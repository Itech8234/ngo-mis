{% extends "ghdi/generic_list.html" %}
{% block list_filters %}
<form method="get" class="card-body d-flex flex-wrap align-items-end gap-3 mb-3" aria-label="Filter community feedback">
  <div class="form-group mb-0"><label class="form-label" for="feedback-status">Status</label><select class="form-input" id="feedback-status" name="status"><option value="">All statuses</option>{% for value,label in statuses %}<option value="{{ value }}" {% if request.GET.status == value %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></div>
  <div class="form-group mb-0"><label class="form-label" for="feedback-category">Category</label><select class="form-input" id="feedback-category" name="category"><option value="">All categories</option>{% for value,label in categories %}<option value="{{ value }}" {% if request.GET.category == value %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></div>
  {% if query %}<input type="hidden" name="q" value="{{ query }}">{% endif %}<button class="btn btn-secondary" type="submit">Apply filters</button>
  {% if request.GET.status or request.GET.category or query %}<a class="btn btn-ghost" href="{% url 'monitoring:feedback_list' %}">Clear</a>{% endif %}
</form>
{% endblock %}
