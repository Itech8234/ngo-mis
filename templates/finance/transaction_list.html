{% extends "ghdi/generic_list.html" %}
{% block list_filters %}
<form method="get" class="card-body d-flex flex-wrap align-items-end gap-3 mb-3" aria-label="Filter transactions">
  <div class="form-group mb-0"><label class="form-label" for="transaction-direction">Direction</label><select class="form-input" id="transaction-direction" name="direction"><option value="">All directions</option>{% for value,label in directions %}<option value="{{ value }}" {% if request.GET.direction == value %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></div>
  <div class="form-group mb-0"><label class="form-label" for="transaction-status">Status</label><select class="form-input" id="transaction-status" name="status"><option value="">All statuses</option>{% for value,label in statuses %}<option value="{{ value }}" {% if request.GET.status == value %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></div>
  {% if query %}<input type="hidden" name="q" value="{{ query }}">{% endif %}
  <button class="btn btn-secondary" type="submit">Apply filters</button>
  {% if request.GET.status or request.GET.direction or query %}<a class="btn btn-ghost" href="{% url 'finance:transaction_list' %}">Clear</a>{% endif %}
</form>
{% endblock %}
