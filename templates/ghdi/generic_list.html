{% extends "base.html" %}{% load ghdi_extras %}
{% block content %}
<div class="page-head">
  <div>
    <h1>{{ page_title }}</h1>
    {% if subtitle %}<p class="sub">{{ subtitle }}</p>{% endif %}
  </div>
  {% if create_url %}<div class="actions"><a class="btn btn-primary" href="{{ create_url }}">{{ create_label|default:"Create" }}</a></div>{% endif %}
</div>

{% block list_filters %}{% endblock %}
{% include "ghdi/_list_results.html" %}
{% endblock %}
