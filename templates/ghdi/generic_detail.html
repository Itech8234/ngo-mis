{% extends "base.html" %}{% load ghdi_extras %}
{% block content %}
<div class="page-head">
  <div><h1>{{ object }}</h1></div>
  <div class="actions">
    {% block detail_actions %}{% endblock %}
    <a class="btn btn-ghost" href="javascript:history.back()">&larr; Back</a>
  </div>
</div>
<div class="card">
  <div class="card-head"><h3>Details</h3></div>
  <div class="card-body">
    <div class="detail-list">
      {% for label, value in object|fieldpairs %}
        <div class="detail-item">
          <div class="k">{{ label }}</div>
          <div class="v">{{ value }}</div>
        </div>
      {% endfor %}
    </div>
  </div>
</div>
{% block detail_extra %}{% endblock %}
{% endblock %}
