<form method="post" action="{% url 'communications:message_detail' message_obj.pk %}">{% csrf_token %}
        {% if form %}{% for f in form %}{% if f.name == "subject" %}<input type="hidden" name="subject" value="Re: {{ message_obj.subject }}">{% elif f.name == "body" %}<textarea class="form-input" name="body" rows="3" placeholder="Write a reply..." required>{{ f.value|default:"" }}</textarea>{% endif %}{% endfor %}{% else %}<textarea class="form-input" name="body" rows="3" placeholder="Write a reply..." required></textarea>{% endif %}
        <button class="btn btn-primary mt-2" type="submit">Reply</button>
      </form>
